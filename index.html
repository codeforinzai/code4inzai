<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Code for INZAI — 成果物一覧</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#faf9f5; --ink:#1d1d1f; --muted:#6b6b70; --accent:#d97757; --accent2:#0b6e99; --line:#e3e0da; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.7; }
  header { padding:56px 24px 32px; border-bottom:1px solid var(--line); text-align:center; }
  header h1 { font-size:34px; font-weight:800; letter-spacing:.02em; }
  header h1 span { color:var(--accent); }
  header p { color:var(--muted); margin-top:10px; font-size:15px; }
  main { max-width:820px; margin:0 auto; padding:36px 24px 80px; }
  h2 { font-size:20px; font-weight:800; margin:32px 0 14px; color:var(--accent2); }
  .card { display:block; background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px 26px; margin-bottom:16px; text-decoration:none; color:var(--ink); transition:border-color .15s; }
  .card:hover { border-color:var(--accent); }
  .card .title { font-size:19px; font-weight:800; }
  .card .title::after { content:" →"; color:var(--accent); }
  .card .desc { font-size:14.5px; color:var(--muted); margin-top:4px; }
  .card .meta { font-size:12.5px; color:var(--accent); font-weight:700; margin-bottom:4px; letter-spacing:.06em; }
  .soon { opacity:.55; }
  .soon .title::after { content:""; }
  .card .desc a { color:var(--accent2); }
  footer { text-align:center; padding:28px; font-size:13px; color:var(--muted); border-top:1px solid var(--line); }
  footer a { color:var(--accent2); }
</style>
</head>
<body>
<header>

  <h2>プロジェクト</h2>
